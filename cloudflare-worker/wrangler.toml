# Cloudflare Worker Configuration — NEET Counselling Payment Backend
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/

name = "neet-payment-worker"
main = "worker.js"
compatibility_date = "2024-12-01"

# ─── Environment Variables (non-secret) ───
[vars]
FIREBASE_PROJECT_ID = "neet-coounselling-web"

# ─── Secrets (set via CLI, NEVER commit these) ───
# Run these commands after first deploy:
#   wrangler secret put RAZORPAY_KEY_ID
#   wrangler secret put RAZORPAY_KEY_SECRET
#   wrangler secret put RAZORPAY_WEBHOOK_SECRET
#   wrangler secret put FIREBASE_SERVICE_ACCOUNT_EMAIL
#   wrangler secret put FIREBASE_SERVICE_ACCOUNT_KEY

# ─── Development ───
[dev]
port = 8787
local_protocol = "http"

